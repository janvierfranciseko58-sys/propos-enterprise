// ----- Client Supabase minimal (fetch direct vers PostgREST) -----
async function signIn(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || "Identifiants invalides");
  return data;
}
async function signUp(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || "Impossible de créer le compte");
  return data;
}
async function query(table, token, params = "") {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error(`Erreur lecture ${table}`);
  return res.json();
}
async function patchRow(table, id, token, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: "PATCH",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Erreur mise à jour ${table}`);
  return res.json();
}
async function insertRow(table, token, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify(body),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json?.message || `Erreur création ${table}`);
  return json;
}
async function deleteRow(table, id, token) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: "DELETE",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, Prefer: "return=representation" },
  });
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j.message || j.details || ""; } catch (_) {}
    if (detail.toLowerCase().includes("foreign key") || detail.includes("23503")) {
      throw new Error("Suppression impossible : des enregistrements liés existent encore (paiements, etc.). Utilise plutôt le statut pour clôturer sans perdre l'historique.");
    }
    throw new Error(detail || `Erreur suppression ${table}`);
  }
}
async function uploadPhoto(file, token, employeeId) {
  const ext = file.name.split(".").pop();
  const path = `${employeeId}-${Date.now()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/employee-photos/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": file.type, "x-upsert": "true" },
    body: file,
  });
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j.message || ""; } catch (_) {}
    throw new Error(detail || "Échec de l'envoi de la photo");
  }
  return `${SUPABASE_URL}/storage/v1/object/public/employee-photos/${path}`;
}
async function uploadDocumentFile(file, path, token) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/documents/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": file.type, "x-upsert": "true" },
    body: file,
  });
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j.message || ""; } catch (_) {}
    throw new Error(detail || "Échec de l'envoi du document");
  }
  return path;
}
async function getSignedDocumentUrl(path, token) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/documents/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },

  if (!res.ok) throw new Error("Impossible de générer le lien de consultation");

}
 async function getSignedPayslipUrl(path, token) {

  const json = await res.json();
  return `${SUPABASE_URL}/storage/v1${json.signedURL}`;
}                                                                                                                                                                   
async function deleteDocumentFile(path, token) {

    method: "DELETE",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },

}

// Formatte un nombre avec des espaces classiques (le caractère spécial utilisé
// par toLocaleString("fr-FR") n'est pas supporté par la police par défaut du PDF)
function pdfNum(n) {
  return Math.round(Number(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " €";
}
function buildClientPayslipPDF(employeeName, period, gross, net, role, department, employerName) {
  const doc = new window.jspdf.jsPDF();
  const cotisationsTotal = Math.max(0, gross - net);
  const cotisationLines = [
    { label: "Sécurité sociale - Maladie", taux: 0.75, weight: 5 },
    { label: "Assurance vieillesse plafonnée", taux: 6.90, weight: 35 },
    { label: "Assurance vieillesse déplafonnée", taux: 0.40, weight: 4 },
    { label: "Retraite complémentaire (T1)", taux: 3.15, weight: 15 },
    { label: "Contribution équilibre général", taux: 0.86, weight: 5 },
    { label: "CSG déductible", taux: 6.80, weight: 28 },
    { label: "CSG/CRDS non déductible", taux: 2.90, weight: 8 },
  ];
  const csgCrdsNDAmount = cotisationsTotal * 8 / 100;
  const netImposable = net + csgCrdsNDAmount;

  doc.setFillColor(10, 38, 71);
  doc.rect(0, 0, 210, 30, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text(employerName, 14, 14);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(200, 205, 215);
  doc.text("Bulletin de paie", 14, 22);

  let y = 42;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text("EMPLOYEUR", 14, y);
  doc.text("SALARIÉ", 120, y);

  y += 7;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(30, 30, 30);
  doc.text(employerName, 14, y);
  doc.text(employeeName, 120, y);

  y += 6;
  doc.setFontSize(9);
  doc.setTextColor(110, 110, 110);
  const posteLine = [role, department].filter(Boolean).join(" — ");
  if (posteLine) doc.text(posteLine, 120, y);

  y += 10;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text("PÉRIODE", 14, y);

  y += 7;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(30, 30, 30);
  doc.text(period, 14, y);

  y += 8;
  doc.setDrawColor(220, 220, 220);
  doc.line(14, y, 196, y);

  y += 10;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(10, 38, 71);
  doc.text("Détail de la rémunération", 14, y);

  y += 8;
  doc.setFontSize(9);
  doc.setTextColor(140, 140, 140);
  doc.text("Rubrique", 14, y);
  doc.text("Taux", 150, y, { align: "right" });
  doc.text("Montant", 182, y, { align: "right" });
  y += 2;
  doc.setDrawColor(230, 230, 230);
  doc.line(14, y, 196, y);

  y += 7;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(30, 30, 30);
  doc.text("Salaire de base", 14, y);
  doc.text(pdfNum(gross), 182, y, { align: "right" });

  y += 8;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text("Cotisations salariales", 14, y);

  y += 6;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(70, 70, 70);
  for (const line of cotisationLines) {
    const montant = cotisationsTotal * line.weight / 100;
    doc.text(line.label, 16, y);
    doc.text(`${line.taux.toFixed(2)} %`, 150, y, { align: "right" });
    doc.text(`- ${pdfNum(montant)}`, 182, y, { align: "right" });
    y += 6;
  }

  doc.setDrawColor(230, 230, 230);
  doc.line(14, y, 196, y);
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.setTextColor(30, 30, 30);
  doc.text("Total cotisations", 14, y);
  doc.text(`- ${pdfNum(cotisationsTotal)}`, 182, y, { align: "right" });

  y += 9;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(110, 110, 110);
  doc.text("Net imposable (estimé)", 14, y);
  doc.text(pdfNum(netImposable), 182, y, { align: "right" });

  y += 10;
  doc.setFillColor(240, 243, 248);
  doc.rect(14, y, 182, 18, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(10, 38, 71);
  doc.text("Net à payer", 20, y + 11);
  doc.setFontSize(14);
  doc.text(pdfNum(net), 182, y + 11, { align: "right" });

  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(140, 140, 140);
  doc.text("Ce document est à conserver sans limitation de durée. Montants estimés à titre indicatif.", 14, 275);
  doc.text(`Document généré le ${new Date().toLocaleDateString("fr-FR")} — ${employerName}`, 14, 280);

  return doc;
}
function exportExcel(filename, sheetName, rows) {
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, `${filename}.xlsx`);
}

function exportPDFTable(title, columns, rows, filename) {
  const doc = new window.jspdf.jsPDF();
  doc.setFontSize(16);
  doc.text(title, 14, 18);
  doc.setFontSize(9);
  doc.setTextColor(130, 130, 130);
  doc.text(`Généré le ${new Date().toLocaleDateString("fr-FR")} — PropOS Enterprise`, 14, 25);
  doc.autoTable({ startY: 32, head: [columns], body: rows, headStyles: { fillColor: [10, 38, 71] }, styles: { fontSize: 8 } });
  doc.save(`${filename}.pdf`);
}

function exportFinanceReport(kpis, latePayments, filename) {
  const doc = new window.jspdf.jsPDF();
  doc.setFontSize(18);
  doc.text("Rapport financier mensuel", 14, 20);
  doc.setFontSize(10);
  doc.setTextColor(130, 130, 130);
  doc.text(`PropOS Enterprise — Généré le ${new Date().toLocaleDateString("fr-FR")}`, 14, 27);

  doc.setFontSize(11);
  doc.setTextColor(20, 20, 20);
  doc.text(`Revenus collectés : ${pdfNum(kpis.collected)}`, 14, 40);
  doc.text(`Loyers en retard : ${pdfNum(kpis.late)}`, 14, 47);
  doc.text(`Taux d'occupation : ${kpis.rate}% (${kpis.occupied} / ${kpis.total} biens)`, 14, 54);

  if (latePayments.length) {
    doc.setFontSize(12);
    doc.text("Loyers en retard — détail", 14, 66);
    doc.autoTable({
      startY: 71,
      head: [["Locataire", "Bien", "Échéance", "Montant"]],
      body: latePayments.map(p => [p.leases?.tenants?.full_name || "—", p.leases?.properties?.name || "—", p.due_date, pdfNum(p.amount)]),
      headStyles: { fillColor: [196, 102, 79] },
      styles: { fontSize: 9 },
    });
  }
  doc.save(`${filename}.pdf`);
}

            <label style={{ fontSize: 12, color: "#8A8577" }}>Mot de passe</label>

              style={{ width: "100%", padding: "10px 12px", borderRadius: 4, border: `1px solid ${SAND}`, margin: "4px 0 18px", fontSize: 13.5 }} />
            {error && <div style={{ background: "#FBEEEA", color: CORAL, fontSize: 12.5, padding: "8px 12px", borderRadius: 4, marginBottom: 14 }}>{error}</div>}
            <button onClick={() => onLogin(email, password, mode)} disabled={loading}
              style={{ width: "100%", background: NAVY_DEEP, color: "#fff", border: "none", borderRadius: 4, padding: "11px 0", fontSize: 13.5, fontWeight: 500, cursor: "pointer" }}>
              {loading ? "Connexion…" : "Se connecter"}
            </button>
            {mode === "tenant" && (
              <div style={{ textAlign: "center", marginTop: 14 }}>
                <span onClick={() => setSignupMode(true)} style={{ fontSize: 12, color: NAVY, cursor: "pointer" }}>Première connexion ? Créer mon accès →</span>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

  const [error, setError] = useState("");
  const [ticketForm, setTicketForm] = useState({ category: "plomberie", description: "" });
  const [submittingTicket, setSubmittingTicket] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const token = session.access_token;
        const [leases, payments, documents, tickets] = await Promise.all([
          query("leases", token, "?select=*,properties(name,address,surface,pieces)"),
          query("payments", token, "?select=*,leases(properties(name))&order=due_date.desc"),
          query("documents", token, "?select=*&order=uploaded_at.desc"),
          query("maintenance_tickets", token, "?select=*,properties(name)&order=created_at.desc"),
        ]);
        setData({ leases, payments, documents, tickets });
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    })();
  }, []);

  const activeLease = data.leases.find(l => l.status === "actif") || data.leases[0];

  async function viewDoc(doc) {
    try {

      window.open(url, "_blank");

  }

  async function submitTicket() {
    if (!activeLease || !ticketForm.description) return;
    setSubmittingTicket(true);
    try {
      const [row] = await insertRow("maintenance_tickets", session.access_token, {
        organization_id: tenant.organization_id,
        property_id: activeLease.property_id,
        category: ticketForm.category,
        priority: "moyen",
        status: "ouvert",
        description: ticketForm.description,
        reported_by_tenant_id: tenant.id,
      });
      setData(d => ({ ...d, tickets: [{ ...row, properties: activeLease.properties }, ...d.tickets] }));
      setTicketForm({ category: "plomberie", description: "" });

    finally { setSubmittingTicket(false); }

      <div style={{ background: NAVY_DEEP, padding: "16px 32px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

            <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, color: NAVY_DEEP, fontSize: 14 }}>P</span>
          </div>
          <div style={{ color: "#fff", fontFamily: "'Fraunces', serif", fontSize: 15 }}>PropOS — Espace Locataire</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <span style={{ color: "#DCE1EA", fontSize: 13 }}>{tenant.full_name}</span>
          <span onClick={onLogout} style={{ color: "#9AA6BC", fontSize: 12.5, cursor: "pointer" }}>Quitter</span>
        </div>
      </div>

      <div style={{ maxWidth: 760, margin: "0 auto", padding: 32 }}>
        {loading && <div style={{ color: "#8A8577", fontSize: 13 }}>Chargement…</div>}
        {error && <div style={{ background: "#FBEEEA", color: CORAL, padding: "12px 16px", borderRadius: 4, marginBottom: 20, fontSize: 13 }}>{error}</div>}

        {!loading && !activeLease && (
          <div style={{ color: "#8A8577", fontSize: 13, textAlign: "center", padding: 40 }}>
            Aucun bail actif n'est associé à ton compte pour l'instant. Contacte ta gestion locative.
          </div>
        )}

        {activeLease && (
          <>
            <SectionCard title="Mon logement" style={{ marginBottom: 18 }}>
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, color: NAVY_DEEP }}>{activeLease.properties?.name}</div>
              <div style={{ fontSize: 12.5, color: "#8A8577", marginTop: 4 }}>📍 {activeLease.properties?.address}</div>
              <div style={{ display: "flex", gap: 24, marginTop: 14, paddingTop: 14, borderTop: `1px solid #F0ECE2` }}>
                <div>
                  <div style={{ fontSize: 10.5, color: "#8A8577", textTransform: "uppercase" }}>Loyer mensuel</div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 17, fontWeight: 600, color: NAVY_DEEP }}>{Number(activeLease.rent).toLocaleString("fr-FR")} €</div>
                </div>
                <div>
                  <div style={{ fontSize: 10.5, color: "#8A8577", textTransform: "uppercase" }}>Début du bail</div>
                  <div style={{ fontSize: 13.5, marginTop: 2 }}>{activeLease.start_date}</div>
                </div>
                <div>
                  <div style={{ fontSize: 10.5, color: "#8A8577", textTransform: "uppercase" }}>Statut</div>
                  <div style={{ fontSize: 13.5, marginTop: 2 }}>{activeLease.status}</div>
                </div>
              </div>
            </SectionCard>

            <SectionCard title="Mes paiements" style={{ marginBottom: 18 }}>
              {data.payments.length === 0 && <div style={{ fontSize: 13, color: "#8A8577" }}>Aucun paiement enregistré.</div>}
              <table className="leases">
                <thead><tr><th>Échéance</th><th>Montant</th><th>Statut</th></tr></thead>

                          fontSize: 11, fontWeight: 600, padding: "3px 9px", borderRadius: 20,
                          background: p.status === "paye" ? "#E9F1EA" : "#FBEEEA",
                          color: p.status === "paye" ? SAGE : CORAL,

            <SectionCard title="Signaler un problème">
              <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                <select style={inputStyle} value={ticketForm.category} onChange={e => setTicketForm({ ...ticketForm, category: e.target.value })}>
                  <option value="plomberie">Plomberie</option>
                  <option value="electricite">Électricité</option>
                  <option value="climatisation">Climatisation</option>
                  <option value="structural">Structurel</option>
                  <option value="ascenseur">Ascenseur</option>
                  <option value="autre">Autre</option>
                </select>
              </div>
              <textarea style={{ ...inputStyle, minHeight: 70, resize: "vertical", marginBottom: 10 }}
                placeholder="Décris le problème rencontré…"
                value={ticketForm.description} onChange={e => setTicketForm({ ...ticketForm, description: e.target.value })} />
              <button style={primaryBtn} disabled={submittingTicket || !ticketForm.description} onClick={submitTicket}>
                {submittingTicket ? "Envoi…" : "Envoyer le signalement"}
              </button>

              {data.tickets.length > 0 && (
                <div style={{ marginTop: 18, paddingTop: 14, borderTop: `1px solid ${SAND}` }}>
                  <div style={{ fontSize: 12, color: "#8A8577", marginBottom: 8 }}>Mes signalements précédents</div>

          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [tenantProfile, setTenantProfile] = useState(null);
  const [authError, setAuthError] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [signupInfo, setSignupInfo] = useState("");
  const [tab, setTab] = useState("overview");
  const [hrTab, setHrTab] = useState("employees");
  const [data, setData] = useState({ buildings: [], properties: [], tenants: [], leases: [], payments: [], maintenance: [], employees: [], payslips: [], leaveRequests: [], documents: [] });
  const [dataError, setDataError] = useState("");
  const [modal, setModal] = useState(null); // 'building' | 'property' | 'tenant' | 'lease' | null
  const [editingProperty, setEditingProperty] = useState(null);
  const [editingBuilding, setEditingBuilding] = useState(null);
  const [viewingEmployee, setViewingEmployee] = useState(null);
  const [employeeModal, setEmployeeModal] = useState(null); // 'add' | employee-object-being-edited | null
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [uploadingDocument, setUploadingDocument] = useState(false);
  const [editingTenant, setEditingTenant] = useState(null);
  const [editingLease, setEditingLease] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  async function handleLogin(email, password, mode) {
    setAuthError(""); setSignupInfo(""); setAuthLoading(true);
    try {
      const auth = await signIn(email, password);
      if (mode === "tenant") {
        const tenantRows = await query("tenants", auth.access_token, `?tenant_user_id=eq.${auth.user.id}&select=*`);
        if (!tenantRows.length) throw new Error("Aucun accès locataire n'est associé à ce compte. Vérifie ton email ou contacte ta gestion locative.");
        setSession(auth);
        setTenantProfile(tenantRows[0]);
      } else {
        const profiles = await query("profiles", auth.access_token, `?id=eq.${auth.user.id}&select=*`);
        if (!profiles.length) throw new Error("Aucun profil trouvé pour cet utilisateur.");
        setSession(auth);
        setProfile(profiles[0]);
      }
    } catch (e) { setAuthError(e.message); }
    finally { setAuthLoading(false); }
  }

  async function handleTenantSignup(email, password) {
    setAuthError(""); setSignupInfo(""); setAuthLoading(true);
    try {
      const result = await signUp(email, password);
      if (result.access_token) {
        const tenantRows = await query("tenants", result.access_token, `?tenant_user_id=eq.${result.user.id}&select=*`);
        if (!tenantRows.length) {
          setSignupInfo("Compte créé, mais aucun bail n'est encore associé à cette adresse email. Contacte ta gestion locative.");
          return;
        }
        setSession(result);
        setTenantProfile(tenantRows[0]);
      } else {
        setSignupInfo("Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.");
      }
    } catch (e) { setAuthError(e.message); }
    finally { setAuthLoading(false); }
  }

  function handleLogout() {
    setSession(null); setProfile(null); setTenantProfile(null);
  }


  useEffect(() => {
    if (!session || !profile) return;
    (async () => {
      try {
        const token = session.access_token;
        const [buildings, properties, tenants, leases, payments, maintenance, documents] = await Promise.all([
          query("buildings", token, "?select=*&order=name.asc"),
          query("properties", token, "?select=*,buildings(name,address)"),
          query("tenants", token, "?select=*"),
          query("leases", token, "?select=*,tenants(full_name,email),properties(name,address)"),
          query("payments", token, "?select=*,leases(tenants(full_name),properties(name))&order=due_date.desc"),
          query("maintenance_tickets", token, "?select=*,properties(name)"),
          query("documents", token, "?select=*&order=uploaded_at.desc"),
        ]);
        let employees = [], payslips = [], leaveRequests = [];
        if (profile.role === "direction") {
          [employees, payslips, leaveRequests] = await Promise.all([
            query("employees", token, "?select=*,buildings(name)"),
            query("payslips", token, "?select=*,employees(full_name,role_title,department)"),
            query("leave_requests", token, "?select=*,employees(full_name)"),
          ]);
        }
        setData({ buildings, properties, tenants, leases, payments, maintenance, employees, payslips, leaveRequests, documents });
      } catch (e) { setDataError(e.message); }
    })();
  }, [session, profile]);

  const allowedTabs = profile ? PERMISSIONS[profile.role] : [];

  async function createBuilding(fields) {
    setSubmitting(true);
    try {
      const [row] = await insertRow("buildings", session.access_token, { ...fields, organization_id: profile.organization_id });
      setData(d => ({ ...d, buildings: [...d.buildings, row].sort((a, b) => a.name.localeCompare(b.name)) }));
      setModal(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function updateBuilding(id, fields) {
    setSubmitting(true);
    try {
      const [row] = await patchRow("buildings", id, session.access_token, fields);
      setData(d => ({
        ...d,
        buildings: d.buildings.map(b => b.id === id ? row : b),
        properties: d.properties.map(p => p.building_id === id ? { ...p, buildings: { name: row.name, address: row.address } } : p),
      }));
      setEditingBuilding(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function deleteBuilding(id) {
    setSubmitting(true);
    try {
      await deleteRow("buildings", id, session.access_token);
      setData(d => ({ ...d, buildings: d.buildings.filter(b => b.id !== id) }));
      setEditingBuilding(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function handleUploadPhoto(file) {
    setUploadingPhoto(true);
    try {
      const tempId = (viewingEmployee && viewingEmployee.id) || "new-" + Date.now();
      return await uploadPhoto(file, session.access_token, tempId);
    } catch (e) { alert(e.message); return null; }
    finally { setUploadingPhoto(false); }
  }

  async function uploadDocumentForTarget(file, docType, linkType, linkId) {
    setUploadingDocument(true);
    try {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const storagePath = `${profile.organization_id}/${linkType}-${linkId}/${Date.now()}-${safeName}`;
      await uploadDocumentFile(file, storagePath, session.access_token);
      const [row] = await insertRow("documents", session.access_token, {
        organization_id: profile.organization_id,
        lease_id: linkType === "lease" ? linkId : null,
        tenant_id: linkType === "tenant" ? linkId : null,
        name: file.name,
        doc_type: docType,
        storage_path: storagePath,
      });
      setData(d => ({ ...d, documents: [row, ...d.documents] }));
    } catch (e) { alert(e.message); }
    finally { setUploadingDocument(false); }
  }

  async function viewDocument(doc) {
    try {
      const url = await getSignedDocumentUrl(doc.storage_path, session.access_token);
      window.open(url, "_blank");
    } catch (e) { alert(e.message); }
  }
   async function viewPayslip(p) {
    try {
      if (p.pdf_path) {
        const url = await getSignedPayslipUrl(p.pdf_path, session.access_token);
        window.open(url, "_blank");
      } else {
        const doc = buildClientPayslipPDF(
          p.employees?.full_name || "—", p.period, Number(p.gross_amount), Number(p.net_amount),
          p.employees?.role_title || null, p.employees?.department || null, "PropOS Enterprise"
        );
        window.open(doc.output("bloburl"), "_blank");
      }
    } catch (e) { alert(e.message); }
  }

  async function removeDocument(doc) {
    if (!confirm(`Supprimer "${doc.name}" ?`)) return;
    try {
      await deleteDocumentFile(doc.storage_path, session.access_token);
      await deleteRow("documents", doc.id, session.access_token);
      setData(d => ({ ...d, documents: d.documents.filter(x => x.id !== doc.id) }));
    } catch (e) { alert(e.message); }
  }

  async function createEmployee(fields) {
    setSubmitting(true);
    try {
      const [row] = await insertRow("employees", session.access_token, { ...fields, organization_id: profile.organization_id });
      const building = data.buildings.find(b => b.id === fields.building_id);
      setData(d => ({ ...d, employees: [...d.employees, { ...row, buildings: building ? { name: building.name } : null }] }));
      setEmployeeModal(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function updateEmployee(id, fields) {
    setSubmitting(true);
    try {
      const [row] = await patchRow("employees", id, session.access_token, fields);
      const building = data.buildings.find(b => b.id === fields.building_id);
      const enriched = { ...row, buildings: building ? { name: building.name } : null };
      setData(d => ({ ...d, employees: d.employees.map(e => e.id === id ? enriched : e) }));
      setEmployeeModal(null);
      setViewingEmployee(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function deleteEmployee(id) {
    setSubmitting(true);
    try {
      await deleteRow("employees", id, session.access_token);
      setData(d => ({ ...d, employees: d.employees.filter(e => e.id !== id) }));
      setViewingEmployee(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function markPaymentPaid(id) {
    setSubmitting(true);
    try {
      const today = new Date().toISOString().slice(0, 10);
      const [row] = await patchRow("payments", id, session.access_token, { status: "paye", paid_date: today });
      setData(d => ({ ...d, payments: d.payments.map(p => p.id === id ? { ...p, ...row } : p) }));
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function approveLeave(id, status) {
    try {
      await patchRow("leave_requests", id, session.access_token, { status });
      setData(d => ({ ...d, leaveRequests: d.leaveRequests.map(l => l.id === id ? { ...l, status } : l) }));
    } catch (e) { alert(e.message); }
  }

  async function createProperty(fields) {
    setSubmitting(true);
    try {
      const [row] = await insertRow("properties", session.access_token, { ...fields, organization_id: profile.organization_id });
      const building = data.buildings.find(b => b.id === fields.building_id);
      setData(d => ({ ...d, properties: [{ ...row, buildings: building ? { name: building.name, address: building.address } : null }, ...d.properties] }));
      setModal(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function updateProperty(id, fields) {
    setSubmitting(true);
    try {
      const [row] = await patchRow("properties", id, session.access_token, fields);
      const building = data.buildings.find(b => b.id === fields.building_id);
      setData(d => ({ ...d, properties: d.properties.map(p => p.id === id ? { ...row, buildings: building ? { name: building.name, address: building.address } : null } : p) }));
      setEditingProperty(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function deleteProperty(id) {
    setSubmitting(true);
    try {
      await deleteRow("properties", id, session.access_token);
      setData(d => ({ ...d, properties: d.properties.filter(p => p.id !== id) }));
      setEditingProperty(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function updateTenant(id, fields) {
    setSubmitting(true);
    try {
      const [row] = await patchRow("tenants", id, session.access_token, fields);
      setData(d => ({
        ...d,
        tenants: d.tenants.map(t => t.id === id ? row : t),
        leases: d.leases.map(l => l.tenant_id === id ? { ...l, tenants: row } : l),
      }));
      setEditingTenant(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function deleteTenant(id) {
    setSubmitting(true);
    try {
      await deleteRow("tenants", id, session.access_token);
      setData(d => ({ ...d, tenants: d.tenants.filter(t => t.id !== id) }));
      setEditingTenant(null);
    } catch (e) { alert(e.message || "Suppression impossible : un bail actif est encore rattaché à ce locataire."); }
    finally { setSubmitting(false); }
  }

  async function updateLease(id, fields) {
    setSubmitting(true);
    try {
      const [row] = await patchRow("leases", id, session.access_token, fields);
      const property = data.properties.find(p => p.id === fields.property_id);
      // Si le bail n'est plus actif, le bien repasse vacant ; s'il redevient actif, le bien repasse occupé
      const newPropertyStatus = fields.status === "actif" ? "occupe" : "vacant";
      if (property && property.status !== newPropertyStatus) {
        await patchRow("properties", fields.property_id, session.access_token, { status: newPropertyStatus });
      }
      setData(d => ({
        ...d,
        leases: d.leases.map(l => l.id === id ? { ...l, ...row, properties: property || l.properties } : l),
        properties: d.properties.map(p => p.id === fields.property_id ? { ...p, status: newPropertyStatus } : p),
      }));
      setEditingLease(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function deleteLease(lease) {
    setSubmitting(true);
    try {
      await deleteRow("leases", lease.id, session.access_token);
      await patchRow("properties", lease.property_id, session.access_token, { status: "vacant" });
      setData(d => ({
        ...d,
        leases: d.leases.filter(l => l.id !== lease.id),
        properties: d.properties.map(p => p.id === lease.property_id ? { ...p, status: "vacant" } : p),
      }));
      setEditingLease(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function createTenant(fields) {
    setSubmitting(true);
    try {
      const [row] = await insertRow("tenants", session.access_token, { ...fields, organization_id: profile.organization_id });
      setData(d => ({ ...d, tenants: [row, ...d.tenants] }));
      setModal(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  async function createLease(fields) {
    setSubmitting(true);
    try {
      const [row] = await insertRow("leases", session.access_token, {
        ...fields, organization_id: profile.organization_id, status: "actif",
      });
      const tenant = data.tenants.find(t => t.id === fields.tenant_id);
      const property = data.properties.find(p => p.id === fields.property_id);
      const enriched = { ...row, tenants: tenant, properties: property };
      setData(d => ({
        ...d,
        leases: [enriched, ...d.leases],
        properties: d.properties.map(p => p.id === fields.property_id ? { ...p, status: "occupe" } : p),
      }));
      setModal(null);
    } catch (e) { alert(e.message); }
    finally { setSubmitting(false); }
  }

  const kpis = useMemo(() => {
    const total = data.properties.length;
    const occupied = data.properties.filter(p => p.status === "occupe").length;
    const vacant = data.properties.filter(p => p.status === "vacant").length;
    const rate = total ? Math.round((occupied / total) * 100) : 0;
    const collected = data.payments.filter(p => p.status === "paye").reduce((s, p) => s + Number(p.amount), 0);
    const late = data.payments.filter(p => p.status === "en_retard").reduce((s, p) => s + Number(p.amount), 0);
    const paidCount = data.payments.filter(p => p.status === "paye").length;
    const lateCount = data.payments.filter(p => p.status === "en_retard").length;
    const recoveryRate = (paidCount + lateCount) ? Math.round((paidCount / (paidCount + lateCount)) * 100) : 100;
    const in60Days = new Date(Date.now() + 60 * 24 * 3600 * 1000).toISOString().slice(0, 10);
    const expiringLeases = data.leases.filter(l => l.status === "actif" && l.end_date && l.end_date <= in60Days).length;
    const urgentTickets = data.maintenance.filter(t => t.status !== "resolu" && t.priority === "urgent").length;
    const openTickets = data.maintenance.filter(t => t.status !== "resolu").length;
    return { total, occupied, vacant, rate, collected, late, lateCount, recoveryRate, expiringLeases, urgentTickets, openTickets };
  }, [data]);

                    data.employees.reduce((groups, e) => {
                      const key = e.buildings?.name || "Siège / Direction";
                      (groups[key] = groups[key] || []).push(e);
                      return groups;
                    }, {})
                  ).map(([buildingName, emps]) => {
                    const byRole = emps.reduce((g, e) => {
                      (g[e.role_title] = g[e.role_title] || []).push(e);
                      return g;
                    }, {});
                    return (
                      <SectionCard key={buildingName} title={`🏢 ${buildingName}`} style={{ marginBottom: 16 }}
                        action={<span style={{ fontSize: 12, color: "#8A8577" }}>{emps.length} personne(s)</span>}>
                        {Object.entries(byRole).map(([role, list]) => (
                          <div key={role} style={{ marginBottom: 14 }}>
                            <div style={{ fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase", color: GOLD, fontWeight: 600, marginBottom: 8 }}>
                              {role} ({list.length})
                            </div>
                            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
                              {list.map(e => (
                                <div key={e.id} onClick={() => setViewingEmployee(e)}
                                  style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", border: `1px solid ${SAND}`, borderRadius: 4, cursor: "pointer" }}
                                  onMouseEnter={ev => ev.currentTarget.style.background = IVORY}
                                  onMouseLeave={ev => ev.currentTarget.style.background = "#fff"}>
                                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                    <PhotoAvatar url={e.photo_url} name={e.full_name} size={32} />
                                    <div>
                                      <div style={{ fontSize: 13, fontWeight: 500 }}>{e.full_name}</div>
                                      <div style={{ fontSize: 11, color: "#8A8577" }}>{e.email}</div>
                                    </div>
                                  </div>
                                  <span style={{
                                    fontSize: 10.5, fontWeight: 600, padding: "3px 8px", borderRadius: 20,
                                    background: e.status === "actif" ? "#E9F1EA" : "#FBF3E3",
                                    color: e.status === "actif" ? SAGE : "#A8862F"
                                  }}>{e.status}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </SectionCard>
                    );
                  })}
                </>
              )}
                            {hrTab === "payroll" && (
                <SectionCard title="Fiches de paie">
                  <table className="leases">
                    <thead><tr><th>Employé</th><th>Période</th><th>Brut</th><th>Net</th><th>Statut</th><th>Fiche</th></tr></thead>
                    <tbody>
                      {data.payslips.map(p => (
                        <tr key={p.id}><td>{p.employees?.full_name}</td><td>{p.period}</td>
                          <td style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{Number(p.gross_amount).toLocaleString("fr-FR")} €</td>
                          <td style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{Number(p.net_amount).toLocaleString("fr-FR")} €</td>
                          <td>{p.status}</td>
                          <td>
                            <span onClick={() => viewPayslip(p)} style={{ fontSize: 11.5, color: NAVY, cursor: "pointer", fontWeight: 500 }}>
                              {p.pdf_path ? "Voir le PDF" : "Générer & voir"}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </SectionCard>
              )}
              )}
              {hrTab === "leave" && (
                <SectionCard title="Demandes de congés">
                  {data.leaveRequests.map(l => (
                    <div key={l.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: "1px solid #F0ECE2" }}>
                      <div>
                        <div style={{ fontSize: 13.5, fontWeight: 500 }}>{l.employees?.full_name} — {l.leave_type}</div>
                        <div style={{ fontSize: 11.5, color: "#8A8577" }}>{l.start_date} → {l.end_date} · {l.days}j</div>
                      </div>
                      {l.status === "en_attente" ? (
                        <div style={{ display: "flex", gap: 6 }}>
                          <button onClick={() => approveLeave(l.id, "approuve")} style={{ background: "#E9F1EA", border: "none", color: SAGE, borderRadius: 3, width: 28, height: 28, cursor: "pointer" }}>✓</button>
                          <button onClick={() => approveLeave(l.id, "refuse")} style={{ background: "#FBEEEA", border: "none", color: CORAL, borderRadius: 3, width: 28, height: 28, cursor: "pointer" }}>✕</button>
                        </div>
                      ) : <span style={{ fontSize: 11, fontWeight: 600, color: l.status === "approuve" ? SAGE : CORAL }}>{l.status}</span>}
                    </div>
                  ))}
                </SectionCard>
              )}
            </>
          )}
        </div>
      </main>

      {modal === "property" && (
        <Modal title="Ajouter un bien" onClose={() => setModal(null)}>
          <AddPropertyForm buildings={data.buildings} onSubmit={createProperty} submitting={submitting} />
        </Modal>
      )}
      {modal === "tenant" && (
        <Modal title="Ajouter un locataire" onClose={() => setModal(null)}>
          <AddTenantForm onSubmit={createTenant} submitting={submitting} />
        </Modal>
      )}
      {modal === "lease" && (
        <Modal title="Créer un bail" onClose={() => setModal(null)}>
          <AddLeaseForm properties={data.properties} tenants={data.tenants} onSubmit={createLease} submitting={submitting} />
        </Modal>
      )}
      {editingProperty && (
        <Modal title="Modifier le bien" onClose={() => setEditingProperty(null)}>
          <EditPropertyForm
            property={editingProperty}
            buildings={data.buildings}
            submitting={submitting}
            onSubmit={fields => updateProperty(editingProperty.id, fields)}
            onDelete={() => deleteProperty(editingProperty.id)}
          />
        </Modal>
      )}
      {modal === "building" && (
        <Modal title="Ajouter un immeuble" onClose={() => setModal(null)}>
          <AddBuildingForm onSubmit={createBuilding} submitting={submitting} />
        </Modal>
      )}
      {editingBuilding && (
        <Modal title="Modifier l'immeuble" onClose={() => setEditingBuilding(null)}>
          <EditBuildingForm
            building={editingBuilding}
            submitting={submitting}
            onSubmit={fields => updateBuilding(editingBuilding.id, fields)}
            onDelete={() => deleteBuilding(editingBuilding.id)}
          />
        </Modal>
      )}
      {viewingEmployee && (
        <Modal title="Fiche employé" onClose={() => setViewingEmployee(null)}>
          <EmployeeCard
            employee={viewingEmployee}
            onEdit={() => setEmployeeModal(viewingEmployee)}
            onDelete={() => deleteEmployee(viewingEmployee.id)}
          />
        </Modal>
      )}
      {employeeModal && (
        <Modal title={employeeModal === "add" ? "Ajouter un employé" : "Modifier l'employé"} onClose={() => setEmployeeModal(null)}>
          <EmployeeForm
            initial={employeeModal === "add" ? null : employeeModal}
            buildings={data.buildings}
            submitting={submitting}
            uploadingPhoto={uploadingPhoto}
            onUploadPhoto={handleUploadPhoto}
            onSubmit={fields => employeeModal === "add" ? createEmployee(fields) : updateEmployee(employeeModal.id, fields)}
          />
        </Modal>
      )}
      {editingTenant && (
        <Modal title="Modifier le locataire" onClose={() => setEditingTenant(null)}>
          <EditTenantForm
            tenant={editingTenant}
            submitting={submitting}
            onSubmit={fields => updateTenant(editingTenant.id, fields)}
            onDelete={() => deleteTenant(editingTenant.id)}
            documents={data.documents.filter(d => d.tenant_id === editingTenant.id)}
            uploadingDoc={uploadingDocument}
            onUploadDoc={uploadDocumentForTarget}
            onViewDoc={viewDocument}
            onDeleteDoc={removeDocument}
          />
        </Modal>
      )}
      {editingLease && (
        <Modal title="Modifier le bail" onClose={() => setEditingLease(null)}>
          <EditLeaseForm
            lease={editingLease}
            properties={data.properties}
            submitting={submitting}
            onSubmit={fields => updateLease(editingLease.id, fields)}
            onDelete={() => deleteLease(editingLease)}
            documents={data.documents.filter(d => d.lease_id === editingLease.id)}
            uploadingDoc={uploadingDocument}
            onUploadDoc={uploadDocumentForTarget}
            onViewDoc={viewDocument}
            onDeleteDoc={removeDocument}
          />
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
